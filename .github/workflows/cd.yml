name: CD

# Continuous Deployment
# - test + build on push to main
# - on GitHub Release: publish ONLY to TestPyPI (account: axcelblade)
#
# Auth (one of):
#   A) Repo secret TEST_PYPI_API_TOKEN  (recommended right now)
#   B) Trusted Publisher on test.pypi.org matching:
#        Owner: axcel-blade
#        Repo: Auto-Gen-Py-Project
#        Workflow: cd.yml
#        Environment: test-pypi
#
# Never commit tokens. Twine username with API tokens is __token__.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

  # TestPyPI only — no production PyPI deploy.
  deploy-test-pypi:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      # Required so OIDC works when TEST_PYPI_API_TOKEN is unset
      id-token: write
      contents: read
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/auto-gen-py-project/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Require TestPyPI credentials
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "${TEST_PYPI_API_TOKEN}" ]; then
            echo "::error::Missing secret TEST_PYPI_API_TOKEN. Add it under Settings → Secrets, or configure a Trusted Publisher on test.pypi.org for environment 'test-pypi'."
            # Continue: OIDC may still work if Trusted Publisher is configured
          else
            echo "Using TEST_PYPI_API_TOKEN for TestPyPI upload"
          fi
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
