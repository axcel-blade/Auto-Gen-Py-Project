[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-gen-py-project"
version = "1.2.2"
description = "AI-ready Python project generator with templates, plugins, and interactive scaffolding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "auto-gen-py-project contributors" }]
keywords = [
    "scaffolding",
    "cookiecutter",
    "generator",
    "templates",
    "cli",
    "fastapi",
    "django",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.4.0",
]

[project.scripts]
auto-gen-py-project = "auto_gen_py_project.cli.app:main"

[project.entry-points."auto_gen_py_project.templates"]
# Built-in templates are registered in code; third-party plugins use this group.

[project.entry-points."auto_gen_py_project.plugins"]
# Third-party plugins: name = "module:Class"

[project.urls]
Homepage = "https://github.com/axcel-blade/Auto-Gen-Py-Project"
Documentation = "https://github.com/axcel-blade/Auto-Gen-Py-Project/blob/main/docs"
Repository = "https://github.com/axcel-blade/Auto-Gen-Py-Project"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_gen_py_project*"]

[tool.setuptools.package-data]
auto_gen_py_project = ["templates/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: integration tests"]

[tool.coverage.run]
source = ["auto_gen_py_project"]
branch = true
