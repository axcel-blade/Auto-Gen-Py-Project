name: CD

# Continuous Deployment
# - test + build on push to main
# - publish on GitHub Release
#
# Preferred: Trusted Publishing (OIDC) — see docs/publishing.md
# Fallback: API token secrets (never commit tokens):
#   PYPI_API_TOKEN       → production https://pypi.org
#   TEST_PYPI_API_TOKEN  → TestPyPI https://test.pypi.org  (account: axcelblade)
#
# Twine username with API tokens is always __token__ (action sets this).

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

  # Production PyPI:
  # - Prefer Trusted Publisher (OIDC) when PYPI_API_TOKEN is unset
  # - Or set repo secret PYPI_API_TOKEN for password-based upload
  deploy-pypi:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/auto-gen-py-project/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # When this secret is empty, the action falls back to OIDC trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}

  # TestPyPI for account axcelblade — requires repo secret TEST_PYPI_API_TOKEN.
  deploy-test-pypi:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/auto-gen-py-project/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
