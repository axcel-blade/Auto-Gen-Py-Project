name: Release & Publish

# Triggered when a GitHub Release is published.
# By Git Flow convention a release is created only after a release/* or
# hotfix/* branch is merged into main and the commit is tagged.
#
# Workflow:
#   1. Build source distribution + wheel.
#   2. Publish to TestPyPI via OIDC Trusted Publisher (no API token required).
#
# Required GitHub settings:
#   - Environment named "testpypi" with a Trusted Publisher configured at
#     https://test.pypi.org/manage/account/publishing/
#   - id-token: write permission (granted below per job)

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.x"
  DIST_DIR: dist

jobs:
  # ------------------------------------------------------------------
  # 1. Run tests one final time on the tagged commit before publishing
  # ------------------------------------------------------------------
  pre-publish-test:
    name: Pre-publish tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/test_build_system.py -v --tb=short

  # ------------------------------------------------------------------
  # 2. Build distributions
  # ------------------------------------------------------------------
  release-build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: pre-publish-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build release distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: ${{ env.DIST_DIR }}/

  # ------------------------------------------------------------------
  # 3. Publish to TestPyPI
  # ------------------------------------------------------------------
  pypi-publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: release-build

    permissions:
      id-token: write

    environment:
      name: testpypi
      url: https://test.pypi.org/project/auto-gen-py-project/${{ github.event.release.tag_name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: ${{ env.DIST_DIR }}/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.DIST_DIR }}/
          repository-url: https://upload.test.pypi.org/legacy/
